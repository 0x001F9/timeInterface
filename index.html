<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Staatliches&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="time-section">
    <div id="details">
      <h1 id="hostname">koronashi.github.io</h1>
      <span id="date">July 30, 2006</span>
      <span id="timezone">Asia/Manila</span>
    </div>
    
    <div id="time-container">
      <p id="dayOfWeek">Monday</p>
      <div id="time">
        <span id="hour">XX</span>
        <span id="minute">XX</span>
        <span id="second">XX</span>
        <span id="meridiem">XX</span>
      </div>
    </div>
  </section>




  <script src="script.js"></script>
</body>
</html>
